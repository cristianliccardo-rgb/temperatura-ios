name: Temperatura

options:
  bundleIdPrefix: com.cristianliccardo
  developmentLanguage: it

settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    SWIFT_VERSION: "5.0"

targets:
  Temperatura:
    type: application
    platform: iOS

    sources:
      - path: Source

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cristianliccardo.temperatura
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Temperatura"
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Mostra la temperatura dell'aria dove ti trovi."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
