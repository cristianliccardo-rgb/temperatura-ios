name: Build Temperatura for iPhone

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: |
          ls /Applications | grep Xcode
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iPhone
        run: |
          xcodebuild \
            -project Temperatura.xcodeproj \
            -scheme Temperatura \
            -sdk iphoneos \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p artifacts/Payload
          cp -R build/Build/Products/Debug-iphoneos/Temperatura.app artifacts/Payload/
          cd artifacts
          zip -r Temperatura.ipa Payload

      - name: Upload iPhone package
        uses: actions/upload-artifact@v4
        with:
          name: Temperatura-iPhone
          path: artifacts/Temperatura.ipa
          retention-days: 7
